# nginx del front del SaaS Mini-ERP.
# - Sirve la SPA Angular con fallback a index.html (rutas del router del lado cliente).
# - Hace de proxy inverso de /api y /Authentication hacia el chasis (servicio "webapi"
#   del compose, puerto 8080). Al servir front y API desde el MISMO origen, el navegador
#   no dispara CORS y las cookies (refresh token) viajan como same-origin.

upstream backend {
    server webapi:8080;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endurecimiento básico y compresión.
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API del chasis: se reenvía tal cual (se conserva el URI /api/... y /Authentication/...).
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /Authentication/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Activos con hash: cacheables de forma agresiva.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea (para tomar despliegues nuevos al recargar).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
